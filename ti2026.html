            left: 0;
            right: 0;

            z-index: 0;

            content: "";

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: tiGlow 4s ease infinite;

            0%, 100% { background-position: 0% 50%; filter: drop-shadow(0 0 20px rgba(255, 0, 85, 0.6)); }
            50% { background-position: 100% 50%; filter: drop-shadow(0 0 40px rgba(153, 0, 255, 0.8)); }

            animation: dotaPulse 1.5s ease-in-out infinite;

            0%, 100% { opacity: 1; box-shadow: 0 0 10px #ff0055; }
            50% { opacity: 0.5; box-shadow: 0 0 25px #ff0055; }
        }

        .flag {
            width: 28px;
            height: 20px;
            object-fit: contain;
            border-radius: 2px;
        }

        .focus-card {
            background: linear-gradient(145deg, rgba(153, 0, 255, 0.15), rgba(255, 0, 85, 0.08));
            border: 2px solid rgba(153, 0, 255, 0.5);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .focus-card::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(153, 0, 255, 0.1) 50%, transparent 60%);
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            from { transform: translateX(-100%) rotate(45deg); }
            to { transform: translateX(100%) rotate(45deg); }
        }

        .focus-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 35px rgba(153, 0, 255, 0.4);
            border-color: rgba(0, 204, 255, 0.7);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #9900ff, #ff0055);
            border-color: #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(153, 0, 255, 0.3);
        }

        .standings-table th {
            background: linear-gradient(180deg, rgba(26, 10, 46, 0.95), rgba(13, 10, 26, 0.95));
        }

        .rank-badge {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);

        .trophy-icon {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .section-title {
            background: linear-gradient(90deg, #ff0055, #9900ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .prediction-badge {
            background: linear-gradient(135deg, rgba(0, 204, 255, 0.2), rgba(153, 0, 255, 0.2));

        .focus-highlight {
            background: linear-gradient(90deg, rgba(153, 0, 255, 0.2), rgba(255, 0, 85, 0.1));

            height: 100%;
            border-radius: 3px;

    </style>
</head>

    // ============================================================
    // FOCUS MATCH IDs
    // ============================================================
    const FOCUS_IDS = [1, 2, 3, 4, 9, 17, 18, 23, 24, 26];

    // ============================================================
    // UTILITY FUNCTIONS
    // ============================================================
    function getTeamInfo(teamKey) {
        const data = TEAM_DATA[teamKey] || { name: teamKey, short: teamKey.substring(0, 3), color: "#808080" };
        return data;
    }

    function parseTime(dateStr) {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return { date: "TBD", time: "TBD" };
        const month = d.getMonth() + 1;
        const day = d.getDate();
        const hours = d.getHours();
        const minutes = d.getMinutes();
        return {
            date: `${month}月${day}日`,
            time: `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`,
            full: `${d.getFullYear()}年${month}月${day}日 ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`
        };
    }

    function getStageName(stage) {
        const map = { "group": "小组赛", "playoff": "淘汰赛", "final": "决赛" };
        return map[stage] || stage;
    }

    // ============================================================
    // COUNTDOWN
    // ============================================================
    function updateCountdown() {
        const opening = new Date('2026-08-13T10:00:00');
        const now = new Date();
        const diff = opening - now;

        if (diff <= 0) {
            ['days','hours','minutes','seconds'].forEach(id => document.getElementById(id).textContent = '00');
            return;
        }

        document.getElementById('days').textContent = String(Math.floor(diff / 86400000)).padStart(2, '0');
        document.getElementById('hours').textContent = String(Math.floor(diff % 86400000 / 3600000)).padStart(2, '0');
        document.getElementById('minutes').textContent = String(Math.floor(diff % 3600000 / 60000)).padStart(2, '0');
        document.getElementById('seconds').textContent = String(Math.floor(diff % 60000 / 1000)).padStart(2, '0');
    }

    // ============================================================
    // RENDER FOCUS MATCHES
    // ============================================================
    function renderFocusMatches() {
        const container = document.getElementById('focus-matches');
        const focusMatches = MATCHES.filter(m => FOCUS_IDS.includes(m.id)).sort((a, b) => new Date(a.start_time) - new Date(b.start_time));

        container.innerHTML = focusMatches.map(m => {
            const home = getTeamInfo(m.home_team);
            const away = getTeamInfo(m.away_team);
            const time = parseTime(m.start_time);
            const prediction = PREDICTIONS[m.id] || { homeProb: 50, awayProb: 50, reason: "等待分析", confidence: "低" };

            return `
            <div class="focus-card rounded-2xl p-5 relative overflow-hidden">
                <div class="relative z-10">
                    <div class="flex items-center justify-between mb-4">
                        <span class="bg-gradient-to-r from-purple-600 to-pink-600 px-3 py-1 rounded-full text-xs font-bold shadow-lg">${m.round}</span>
                        <span class="bg-gray-700/80 px-2.5 py-1 rounded-full text-xs font-bold">BO${m.best_of}</span>
                    </div>

                    <div class="flex items-center justify-center gap-4 mb-4">
                        <div class="text-center flex-1">
                            <div class="team-logo mx-auto mb-2" style="background: ${home.color}20; border: 2px solid ${home.color};">${home.short}</div>
                            <div class="text-white font-bold text-sm">${home.name}</div>
                        </div>
                        <div class="text-center">
                            <div class="beijing-time-box text-center">
                                <div class="text-gray-400 text-xs mb-1">VS</div>
                                <div class="text-white font-bold text-2xl">VS</div>
                            </div>
                        </div>
                        <div class="text-center flex-1">
                            <div class="team-logo mx-auto mb-2" style="background: ${away.color}20; border: 2px solid ${away.color};">${away.short}</div>
                            <div class="text-white font-bold text-sm">${away.name}</div>
                        </div>
                    </div>

                    <div class="bg-gray-900/80 rounded-xl p-3 mb-3 border border-purple-500/20">
                        <div class="text-white font-semibold text-sm">${time.date}</div>
                        <div class="text-pink-400 font-black text-xl">${time.time}</div>
                    </div>

                    <div class="prediction-badge rounded-lg p-3 mb-3">
                        <div class="text-gray-300 text-xs mb-2">📊 胜负预测</div>
                        <div class="flex gap-2 mb-2">
                            <div class="flex-1 text-center">
                                <div class="text-green-400 font-bold text-sm">${prediction.homeProb}%</div>
                                <div class="prob-bar mt-1">

                    </div>
                </div>
            </div>
            `;
        }).join('');
    }

    // RENDER BRACKET
    // ============================================================
    function renderBracket() {
        const container = document.getElementById('bracket-display');
        const stages = [

            { name: "16强", type: "qf" },
            { name: "8强", type: "qf" },
            { name: "半决赛", type: "sf" },
            { name: "决赛", type: "f" },
        ];

        container.innerHTML = stages.map(stage => {
            const stageMatches = MATCHES.filter(m => m.stage === stage.type);
            return `
            <div class="flex flex-col gap-3 min-w-[180px]">
                <div class="text-center text-purple-400 text-sm font-bold mb-2">${stage.name}</div>
                ${stageMatches.map(m => {
                    const home = getTeamInfo(m.home_team);
                    const away = getTeamInfo(m.away_team);
                    return `
                    <div class="bg-gray-900/80 border border-purple-500/30 rounded-lg p-3">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="team-logo w-6 h-6 text-[8px]" style="background: ${home.color}40; border: 1px solid ${home.color};">${home.short}</div>
                            <span class="text-xs text-gray-300 flex-1">${home.name}</span>
                        </div>

                        <div class="text-center text-[10px] text-gray-500 mt-2">BO${m.best_of}</div>
                    </div>
                    `;
                }).join('')}
            </div>
            `;
        }).join('');
    }

    // ============================================================
    // RENDER STANDINGS
    // ============================================================
    function renderStandings() {
        const tbody = document.getElementById('standings-body');
        const standings = [...INITIAL_STANDINGS];

        tbody.innerHTML = standings.map((s, i) => {
            const team = getTeamInfo(s.team);
            const winRate = s.wins + s.losses > 0 ? Math.round((s.wins / (s.wins + s.losses)) * 100) : 0;
            const statusClass = i < 8 ? "rank-qualify" : i < 12 ? "bg-gray-600" : "rank-eliminated";
            const statusText = i < 8 ? "晋级" : i < 12 ? "待定" : "淘汰";

            return `
            <tr class="border-b border-purple-500/20 hover:bg-purple-500/10 transition-all">
                <td class="py-3 px-4"><span class="rank-badge ${statusClass}">${i + 1}</span></td>
                <td class="py-3 px-4">
                    <div class="flex items-center gap-2">
                        <div class="team-logo" style="background: ${team.color}40; border: 1px solid ${team.color};">${team.short}</div>
                        <span class="font-semibold">${team.name}</span>
                    </div>
                </td>
                <td class="py-3 px-3 text-center text-green-400 font-bold">${s.wins}</td>
                <td class="py-3 px-3 text-center text-red-400 font-bold">${s.losses}</td>
                <td class="py-3 px-3 text-center">${winRate}%</td>
                <td class="py-3 px-3 text-center"><span class="px-2 py-0.5 rounded text-xs ${statusClass}">${statusText}</span></td>
            </tr>
            `;
        }).join('');
    }

    // ============================================================
    // RENDER SCHEDULE
    // ============================================================
    function renderSchedule() {
        const tbody = document.getElementById('schedule-body');
        const stageFilter = document.getElementById('stage-filter').value;

        let filtered = [...MATCHES];
        if (stageFilter !== 'all') {
            filtered = filtered.filter(m => m.stage === stageFilter);
        }
        filtered.sort((a, b) => new Date(a.start_time) - new Date(b.start_time));

        tbody.innerHTML = filtered.map((m, idx) => {
            const home = getTeamInfo(m.home_team);
            const away = getTeamInfo(m.away_team);
            const time = parseTime(m.start_time);
            const isFocus = FOCUS_IDS.includes(m.id);

            return `
            <tr class="border-b border-purple-500/20 hover:bg-purple-500/10 transition-all ${isFocus ? 'focus-highlight' : ''}">
                <td class="py-3 px-4 text-gray-500">${idx + 1}</td>
                <td class="py-3 px-4">
                    <div class="beijing-time-box inline-block">
                        <div class="text-gray-300 text-xs">${time.date}</div>
                        <div class="text-pink-400 font-black text-lg">${time.time}</div>
                    </div>
                </td>
                <td class="py-3 px-4">
                    <div class="flex items-center gap-2">
                        <div class="team-logo" style="background: ${home.color}40; border: 1px solid ${home.color};">${home.short}</div>
                        <span class="${isFocus ? 'text-purple-400 font-bold' : 'text-white'}">${home.name}</span>
                        <span class="text-gray-600">vs</span>
                        <div class="team-logo" style="background: ${away.color}40; border: 1px solid ${away.color};">${away.short}</div>
                        <span class="${isFocus ? 'text-purple-400 font-bold' : 'text-white'}">${away.name}</span>
                        ${isFocus ? '<span class="ml-1 text-xs">⭐</span>' : ''}
                    </div>
                </td>
                <td class="py-3 px-4"><span class="bg-purple-700/50 px-2.5 py-1 rounded-full text-xs font-medium">BO${m.best_of}</span></td>
                <td class="py-3 px-4 text-center"><span class="bg-gray-700/80 px-2.5 py-1 rounded-full text-xs font-bold">未开始</span></td>
            </tr>
            `;
        }).join('');
    }

    // ============================================================
    // TAB NAVIGATION
    // ============================================================
    function initTabs() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(`section-${btn.dataset.tab}`).classList.remove('hidden');
            });
        });
    }

    // ============================================================
    // INIT
    // ============================================================
    function init() {
        updateCountdown();
        setInterval(updateCountdown, 1000);

        initTabs();
        renderFocusMatches();
        renderBracket();
        renderStandings();
        renderSchedule();

        document.getElementById('stage-filter').addEventListener('change', renderSchedule);
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
